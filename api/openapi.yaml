openapi: 3.1.0
info:
  title: JST API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Check if backend responds
      responses:
        "200":
          description: The backend is running
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
        "503":
          description: The database connection is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/postings:
    get:
      operationId: listPostings
      summary: List saved posting summaries
      description: |
        Returns all matches, ordered by capture time descending, then ID descending.
        Search matches literal substrings in company, title, or description.
        Surrounding search whitespace is trimmed. ASCII matching is case-insensitive.
        Percent signs and underscores are ordinary search characters.
        Search and category filters combine. No pagination metadata is returned.
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Literal search phrase; omitted or blank means no text restriction.
        - name: employment_type
          in: query
          schema:
            type: string
            enum: ["", unknown, full_time, other]
          description: Omitted or empty means All; unknown selects null values.
        - name: workplace_arrangement
          in: query
          schema:
            type: string
            enum: ["", unknown, remote, hybrid, on_site]
          description: Omitted or empty means All; unknown selects null values.
      responses:
        "200":
          description: Matching summaries; items is an empty array when nothing matches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostingList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createPosting
      summary: Capture a manual posting
      requestBody:
        $ref: "#/components/requestBodies/PostingSave"
      responses:
        "201":
          description: The saved posting.
          headers:
            Location:
              description: Relative API URL of the saved posting.
              schema:
                type: string
              example: /api/v1/postings/123
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Posting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/DuplicateURL"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/postings/{id}:
    parameters:
      - $ref: "#/components/parameters/PostingID"

    get:
      operationId: getPosting
      summary: Retrieve a saved posting
      responses:
        "200":
          description: The full posting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Posting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      operationId: replacePosting
      summary: Replace a posting's editable fields
      description: |
        Replaces all editable fields. Omitted optional fields become null.
        Preserves ID, source, and creation time, and refreshes modification time.
        Editing excludes the current posting from duplicate URL comparison.
      requestBody:
        $ref: "#/components/requestBodies/PostingSave"
      responses:
        "200":
          description: The saved posting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Posting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/DuplicateURL"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deletePosting
      summary: Permanently delete a posting
      responses:
        "204":
          description: The posting was deleted; the response has no body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    PostingID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  requestBodies:
    PostingSave:
      required: true
      description: |
        One JSON object, no larger than 1 MiB (1048576 bytes).
        Unknown fields and additional JSON values are rejected.
        Optional fields may be omitted or null.
        On PUT, omitted optional fields clear previous values.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PostingInput"
          example:
            company: Example Company
            title: Junior Developer
            url: https://example.com/jobs/123
            description: |-
              First line
              Second line
            location: Boston, MA
            employment_type: full_time
            workplace_arrangement: remote

  responses:
    BadRequest:
      description: |
        validation_failed includes all applicable field_errors.
        invalid_json indicates an invalid request body.
        invalid_id indicates an invalid posting path ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            validation:
              value:
                error:
                  code: validation_failed
                  message: Check the highlighted fields.
                  field_errors:
                    company: Enter a company.
                    title: Enter a job title.
            invalidJSON:
              value:
                error:
                  code: invalid_json
                  message: Send one JSON object with valid posting field types and no extra fields.
            invalidID:
              value:
                error:
                  code: invalid_id
                  message: Use a positive numeric posting ID.

    Forbidden:
      description: A cross-origin mutation was rejected (cross_origin_forbidden).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: The posting was not found (not_found).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    MethodNotAllowed:
      description: The request method is not supported (method_not_allowed).
      headers:
        Allow:
          description: Supported methods for this endpoint.
          schema:
            type: string
            enum:
              - GET, HEAD, POST
              - GET, HEAD, PUT, DELETE
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    DuplicateURL:
      description: Another posting has the same normalized URL (duplicate_url).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: duplicate_url
              message: A posting with this URL already exists.
              existing_posting_id: 123

    PayloadTooLarge:
      description: The save request exceeds 1 MiB (payload_too_large).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: payload_too_large
              message: Posting requests must be no larger than 1 MiB.

    UnsupportedMediaType:
      description: Content-Type must be application/json; parameters such as charset are allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unsupported_media_type
              message: Use application/json for posting requests.

    InternalError:
      description: An unexpected store failure occurred (internal_error).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: internal_error
              message: Unable to complete the posting request.
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            field_errors:
              type: object
              additionalProperties:
                type: string
              description: Field names mapped to correction messages.
            existing_posting_id:
              type: integer
              format: int64
              minimum: 1
              description: The existing posting responsible for a URL conflict.
    PostingInput:
      type: object
      additionalProperties: false
      required:
        - company
        - title
        - url
        - description
      properties:
        company:
          type: string
          minLength: 1
          description: Required non-whitespace text; surrounding whitespace is trimmed.
        title:
          type: string
          minLength: 1
          description: Required non-whitespace text; surrounding whitespace is trimmed.
        url:
          type: string
          format: uri
          description: |
            Required absolute HTTP or HTTPS URL without embedded credentials.
            Surrounding whitespace is trimmed; the entered URL is retained.
        description:
          type: string
          minLength: 1
          description: Required non-whitespace plain text; preserve its exact whitespace and line breaks.
        location:
          type: [string, "null"]
          description: Surrounding whitespace is trimmed; missing or blank values become null.
        employment_type:
          type: [string, "null"]
          enum: [full_time, other, null]
          description: null means Unknown; missing values also become null.
        workplace_arrangement:
          type: [string, "null"]
          enum: [remote, hybrid, on_site, null]
          description: null means Unknown; missing values also become null.

    Posting:
      type: object
      required:
        - id
        - company
        - title
        - url
        - description
        - location
        - employment_type
        - workplace_arrangement
        - source
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        company:
          $ref: "#/components/schemas/PostingInput/properties/company"
        title:
          $ref: "#/components/schemas/PostingInput/properties/title"
        url:
          $ref: "#/components/schemas/PostingInput/properties/url"
        description:
          $ref: "#/components/schemas/PostingInput/properties/description"
        location:
          $ref: "#/components/schemas/PostingInput/properties/location"
        employment_type:
          $ref: "#/components/schemas/PostingInput/properties/employment_type"
        workplace_arrangement:
          $ref: "#/components/schemas/PostingInput/properties/workplace_arrangement"
        source:
          type: string
          enum: [manual]
        created_at:
          type: string
          format: date-time
          description: Capture time in UTC.
        updated_at:
          type: string
          format: date-time
          description: Last successful save time in UTC.

    PostingSummary:
      type: object
      required:
        - id
        - company
        - title
        - location
        - employment_type
        - workplace_arrangement
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        company:
          $ref: "#/components/schemas/PostingInput/properties/company"
        title:
          $ref: "#/components/schemas/PostingInput/properties/title"
        location:
          $ref: "#/components/schemas/PostingInput/properties/location"
        employment_type:
          $ref: "#/components/schemas/PostingInput/properties/employment_type"
        workplace_arrangement:
          $ref: "#/components/schemas/PostingInput/properties/workplace_arrangement"

    PostingList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PostingSummary"